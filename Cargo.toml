[package]
name = "otel-log-wrapper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zero-config OpenTelemetry tracing/logging setup around init-tracing-opentelemetry"
keywords = ["opentelemetry", "otel", "tracing", "logging"]
repository = "https://github.com/qiaoruntao/otel-log-wrapper"

[features]
default = ["detect-host"]
detect-host = ["dep:hostname"]

[dependencies]
init-tracing-opentelemetry = { version = "0.37", features = ["otlp", "tonic", "logs", "metrics", "tracing_subscriber_ext"] }
opentelemetry = "0.31"
tracing = "0.1"
hostname = { version = "0", optional = true }

[dev-dependencies]
serial_test = "3"
